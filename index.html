<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Venas PDF Editor</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


<header class="toolbar">


    <label
        for="fileInput"
        class="btn primary"
    >
        📄 Carregar PDF
    </label>


    <input
        id="fileInput"
        type="file"
        accept="application/pdf"
        hidden
    >


    <button
        id="saveBtn"
        class="btn"
        disabled
    >
        💾 Salvar PDF
    </button>


    <span id="status">
        Nenhum PDF carregado
    </span>


</header>


<main>

    <div id="viewer"></div>

</main>


<!-- PDF.JS -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>


<!-- PDF-LIB -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
</script>


<!-- Aplicação -->

<script src="./js/pdf-viewer.js"></script>

<script src="./js/pdf-editor.js"></script>


</body>

</html>
