<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Venas PDF Editor</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header>
  <label class="btn primary" for="pdfFile">
    📄 Carregar PDF
  </label>

  <input id="pdfFile" type="file" accept="application/pdf">

  <button id="downloadBtn" class="btn" disabled>
    💾 Baixar PDF
  </button>

  <span id="status">
    Aguardando PDF…
  </span>
</header>

<main>

  <div class="help">
    <b>Venas PDF Editor</b><br>
    Carregue um PDF e clique sobre um texto detectado para editar.
  </div>

  <section id="pages"></section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="./js/app.js"></script>

</body>
</html>
